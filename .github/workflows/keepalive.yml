# Keeps the free Render backend awake (it sleeps after 15 idle minutes) so
# judges never wait for a cold start. Free for public repositories.
name: keep-backend-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 120 https://hydrosentinel-ph-api.onrender.com/api/health
